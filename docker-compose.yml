name: ref-reader-backend

services:
  ref_reader_backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ref_reader_backend
    env_file: .env
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      - QDRANT_HOST=qdrant  # Explicitly set the host to container name
      - QDRANT_PORT=6333
    networks:
      - app-network
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"  # Changed back to default port
    volumes:
      - qdrant_data:/qdrant/storage  # Add persistence
    networks:
      - app-network

volumes:
  qdrant_data:  # Add volume definition

networks:
  app-network:
    driver: bridge
